name: Python CI

on: push: branches: [ main ] pull_request: branches: [ main ]

jobs: test: runs-on: ubuntu-latest strategy: matrix: python-version: [3.10, 3.11] steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v4 with: python-version: ${{ matrix.python-version }} - name: Install pip run: python -m pip install --upgrade pip - name: Import check run: python -c "import calculator; print('import ok')"

Commit directly to add/license-ci (message: chore: add CI workflow).
Click Compare & pull request and create the PR into main.
